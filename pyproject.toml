[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop_automator"
version = "0.1.0"
description = "A local desktop automation tool using a hybrid Computer Vision and Coordinate approach."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pynput",
    "pyautogui",
    "opencv-python",
    "mss",
    "Pillow",
    "pydantic>=2.0.0"
]

[project.scripts]
automator = "automator.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["automator", "automator.cli", "automator.core", "automator.models", "automator.utils"]
